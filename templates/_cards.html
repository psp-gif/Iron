<div class="product-grid">{% for p in products %}<article class="product-card reveal" data-name="{{ p.name }} {{ p.cpu }} {{ p.gpu }}" data-category="{{ p.category }}" data-condition="{{ p.condition }}" data-price="{{ p.price }}"><div class="card-top"><span class="badge">{{ 'Б/у' if p.condition == 'used' else 'Новый' }}</span><span class="muted">{{ {'game':'Игровой','office':'Офисный','work':'Рабочая станция'}[p.category] }}</span></div><a class="product-image" href="/product/{{ p.id }}"><img src="{{ p.image }}" alt="Иллюстрация {{ p.name }} — внешний вид условный" loading="lazy"></a><a href="/product/{{ p.id }}"><h3>{{ p.name }}</h3></a><p class="muted">{{ p.cpu }}</p><div class="specs"><span>{{ p.gpu }}</span><span>{{ p.ram }} · {{ p.disk }}</span></div><div class="card-bottom"><strong>{{ p.price|money }}</strong><button class="add-cart small-button" data-id="{{ p.id }}" aria-label="Добавить {{ p.name }} в корзину">В корзину +</button></div></article>{% endfor %}</div>
